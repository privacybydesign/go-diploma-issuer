# Workflow to check whether changes to main fulfill all requirements.
name: Status checks

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Run every monday on 9:00 in the morning (UTC).
    - cron: "0 9 * * 1"
  # Make it possible to trigger the checks manually.
  workflow_dispatch:

jobs:
    build-frontend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
            node-version: '24'
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install dependencies
          working-directory: frontend
          run: npm ci

        - name: Typecheck
          working-directory: frontend
          run: npm run typecheck

        - name: Build
          working-directory: frontend
          run: npm run build

    analyze-go:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
          with:
            go-version-file: backend/go.mod

        - name: Install GolangCI-Lint
          run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

        - name: Run linter
          working-directory: backend
          run: golangci-lint run --timeout 5m

    test-go:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        - name: Build Docker image for testing
          run: docker build -t diploma-issuer-tests --file Dockerfile.test .

        - name: Create coverage directory
          run: mkdir -p coverage

        - name: Run tests (emit coverage.out)
          # Mount ./coverage from the runner into /coverage in the container
          run: |
            docker run --rm \
              -v "${{ github.workspace }}/coverage:/coverage" \
              diploma-issuer-tests

        - name: Upload coverage to Codecov
          uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
          with:
            files: coverage/coverage.out
            flags: backend
            fail_ci_if_error: false
          env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    build-docker-image:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        - name: Docker meta
          id: meta
          uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
          with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=semver,pattern={{major}}.{{minor}}.{{patch}}
              type=raw,value=edge

        - name: Build container
          uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
          with:
            context: .
            push: false
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
