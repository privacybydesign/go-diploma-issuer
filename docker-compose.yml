services:
  diploma-issuer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diploma-issuer
    ports:
      - "8080:8080"
    expose:
      - 8080
    volumes:
      - ./local-secrets:/secrets
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      - redis

  redis:
    image: 'bitnami/redis:latest'
    environment:
      - REDIS_PASSWORD=password
      - REDIS_PORT_NUMBER=6379
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
